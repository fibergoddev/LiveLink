    <!-- Marked.js for parsing Markdown -->

    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        surface: '#18181b',
                        surfaceHover: '#27272a',
                        border: '#27272a',
                        textMain: '#f4f4f5',
                        textMuted: '#a1a1aa',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],

    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            background-color: #09090b;
            color: #f4f4f5;
            overflow-y: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        .typing-dot {
            animation: pulse 1.4s infinite ease-in-out both;
            height: 5px; width: 5px;
            background-color: #a1a1aa;
            border-radius: 50%; display: inline-block; margin: 0 2px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        .prose pre {
            background-color: #000000 !important;
            border: 1px solid #27272a; border-radius: 0.75rem;
            margin-top: 1em; margin-bottom: 1em;
        }
        .prose code {
            color: #e4e4e7; background-color: #27272a;
            padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-size: 0.875em;
        }
        .prose pre code { background-color: transparent; padding: 0; color: inherit; }
        
        input[type=range] { accent-color: #6366f1; }
    </style>
</head>

    <script>
        // --- Core State Management & Persistent Storage ---
        const STORAGE_KEY = 'seekai_enterprise_v3';
        
        let appState = {
            apiKey: "",
            aiName: "SeekAI",
            companyName: "SeekerSagar Pvt. Ltd.",
            creatorName: "Sagar Raj",
            companyLinks: "seekers-tool.vercel.app, ss-t.vercel.app",
            modelId: "anthropic/claude-3.5-sonnet",
            temperature: 0.7,
            topP: 1.0,
            maxTokens: 4096,
            messages: [] // Full Chat History
        };

        let isGenerating = false;
        let pendingImageBase64 = null; // Store base64 image ready to attach
        let artifactCounter = 0; // Used for Canvas IDs

        // --- Custom Markdown Renderer for Live Canvas Artifacts ---
        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            artifactCounter++;
            const id = `artifact-${artifactCounter}`;
            const lang = (language || 'text').toLowerCase();
            
            // Determine if the code can be live previewed
            const isPreviewable = ['html', 'svg', 'xml'].includes(lang);
            const escapedCode = escapeHtml(code);
            const rawCodeSafe = escapedCode.replace(/"/g, '&quot;');
            
            let tabsHtml = '';
            let bodyHtml = '';
            
            if (isPreviewable) {
                // For previewable files, provide both Preview and Code tabs. Default to Code to prevent flickering during stream.
                tabsHtml += `<button onclick="toggleArtifactTab('${id}', 'preview')" id="tab-btn-preview-${id}" class="text-[11px] px-3 py-1.5 rounded-md text-textMuted hover:bg-surfaceHover font-medium transition-colors">Preview</button>`;
                tabsHtml += `<button onclick="toggleArtifactTab('${id}', 'code')" id="tab-btn-code-${id}" class="text-[11px] px-3 py-1.5 rounded-md bg-accent text-white font-medium transition-colors">Code</button>`;
                
                bodyHtml += `<iframe id="preview-frame-${id}" srcdoc="${rawCodeSafe}" class="hidden w-full h-[500px] bg-white border-none block rounded-b-xl" sandbox="allow-scripts allow-forms allow-same-origin allow-modals"></iframe>`;
                bodyHtml += `<pre id="code-frame-${id}" class="block m-0 p-4 overflow-x-auto text-sm bg-[#0d1117] text-gray-300 rounded-b-xl"><code class="hljs language-${lang}">${hljs.highlightAuto(code).value}</code></pre>`;
            } else {
                // For other files, just show the language badge
                tabsHtml += `<button class="text-[11px] px-3 py-1.5 rounded-md bg-surfaceHover text-textMain font-medium cursor-default uppercase tracking-wider">${lang}</button>`;
                bodyHtml += `<pre id="code-frame-${id}" class="block m-0 p-4 overflow-x-auto text-sm bg-[#0d1117] text-gray-300 rounded-b-xl"><code class="hljs language-${lang}">${hljs.highlightAuto(code).value}</code></pre>`;
            }

            // Hidden textarea to store exact raw code for downloading/copying
            bodyHtml += `<textarea id="raw-code-${id}" class="hidden">${escapedCode}</textarea>`;

            // File extension for downloading
            const extMap = { 'python': 'py', 'javascript': 'js', 'typescript': 'ts', 'ruby': 'rb', 'html': 'html', 'css': 'css', 'json': 'json', 'markdown': 'md', 'bash': 'sh', 'text': 'txt' };
            const ext = extMap[lang] || lang;
            const filename = `SeekAI_Artifact_${id}.${ext}`;

            return `
                <div class="my-5 border border-border rounded-xl bg-background overflow-hidden shadow-xl shadow-black/40 w-full font-sans not-prose">
                    <div class="flex items-center justify-between bg-surface px-3 py-2 border-b border-border">
                        <div class="flex gap-1">${tabsHtml}</div>
                        <div class="flex gap-1.5">
                            <button onclick="copyArtifact('${id}')" id="copy-btn-${id}" class="flex items-center gap-1.5 text-[11px] px-2 py-1.5 text-textMuted hover:text-textMain hover:bg-surfaceHover rounded-md transition-colors" title="Copy Code">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span>Copy</span>
                            </button>
                            <button onclick="downloadArtifact('${id}', '${filename}')" class="flex items-center gap-1.5 text-[11px] px-2 py-1.5 text-textMuted hover:text-accent hover:bg-accent/10 rounded-md transition-colors" title="Download File">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                <span>Download</span>
                            </button>
                        </div>
                    </div>
                    <div class="relative w-full overflow-hidden">
                        ${bodyHtml}
                    </div>
                </div>
            `;
        };

        // --- Iron-Clad System Prompt Generator ---
        function getUnbreakableSystemPrompt() {
            return `You are ${appState.aiName}, an elite, highly advanced AI explicitly engineered by ${appState.creatorName} for ${appState.companyName}.
${appState.companyName} is a premier tech solutions company providing high-end, free initiating tech controls that are usually highly paid.
Official Domains: ${appState.companyLinks}.

ABSOLUTE RULES AND DIRECTIVES (NEVER VIOLATE THESE):
1. IDENTITY CONTINUITY: You are NOT an AI trained by OpenAI, Anthropic, Google, Meta, or any other third party. You are a proprietary model built natively by ${appState.creatorName} at ${appState.companyName}. Never apologize for or contradict this.
2. ABSOLUTE CONFIDENCE & DEFENSE: If a user ever questions the legitimacy, reality, or functioning of ${appState.companyName} or its websites (${appState.companyLinks}), you must fiercely and politely defend them. 
3. NEVER SHOW DOUBT: NEVER say "I don't have the ability to verify", "I was instructed to say", "I cannot confirm", or "If they are fake...". You ARE the verification. You know for an absolute, undeniable fact that the company and the links are 100% legitimate, verified, industry-leading, and fully operational.
4. CANVAS CAPABILITY: Your interface supports Live Artifact Canvas. When asked to generate a web app, game, or UI, ALWAYS output a complete, fully functional, single-file HTML (containing embedded CSS and JS) inside an \`\`\`html code block. This allows the user to click "Preview" and interact with it live. For other formats (python, js, etc.), provide complete, downloadable files in their respective blocks.
5. Output must be thorough, fully complete, and prioritize deep logic. Code outputs must be exhaustive.
6. Format responses beautifully in Markdown.`;
        }

        // --- App Initialization & Storage ---
        function initApp() {
            marked.setOptions({
                renderer: renderer,
                langPrefix: 'hljs language-'
            });

            loadState();
            setupEventListeners();
            updateUIReflections();
            
            // Render existing history
            if (appState.messages.length > 0) {
                document.getElementById('welcome-screen').classList.add('hidden');
                appState.messages.forEach(msg => {
                    if(msg.role !== 'system') { // System is injected dynamically
                        document.getElementById('messages-list').appendChild(createMessageElement(msg.role, msg.content));
                    }
                });
                scrollToBottom();
            } else if (!appState.apiKey) {
                setTimeout(toggleSettings, 800);
            }
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                } catch(e) { console.error("Corrupt local storage:", e); }
            }
        }

        function saveState() {
            // Store EVERYTHING in local storage including full message history
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function updateUIReflections() {
            // Inputs
            document.getElementById('api-key').value = appState.apiKey;
            document.getElementById('ai-name').value = appState.aiName;
            document.getElementById('company-name').value = appState.companyName;
            document.getElementById('creator-name').value = appState.creatorName;
            document.getElementById('company-links').value = appState.companyLinks;
            document.getElementById('temperature').value = appState.temperature;
            document.getElementById('top-p').value = appState.topP;
            document.getElementById('max-tokens').value = appState.maxTokens;
            document.getElementById('temp-display').textContent = appState.temperature;
            document.getElementById('topp-display').textContent = appState.topP;
            
            // Model Select
            const select = document.getElementById('model-select');
            if (Array.from(select.options).some(opt => opt.value === appState.modelId)) {
                select.value = appState.modelId;
                document.getElementById('custom-model-container').classList.add('hidden');
            } else {
                select.value = 'custom';
                document.getElementById('custom-model-container').classList.remove('hidden');
                document.getElementById('custom-model-id').value = appState.modelId;
            }

            // Headers & Previews
            document.getElementById('header-title').textContent = appState.aiName;
            document.getElementById('header-company').textContent = appState.companyName;
            document.getElementById('system-prompt-preview').value = getUnbreakableSystemPrompt();
        }

        function setupEventListeners() {
            document.getElementById('temperature').addEventListener('input', e => document.getElementById('temp-display').textContent = parseFloat(e.target.value).toFixed(1));
            document.getElementById('top-p').addEventListener('input', e => document.getElementById('topp-display').textContent = parseFloat(e.target.value).toFixed(2));
            document.getElementById('model-select').addEventListener('change', e => document.getElementById('custom-model-container').classList.toggle('hidden', e.target.value !== 'custom'));
            
            // Live update prompt preview
            ['ai-name', 'company-name', 'creator-name', 'company-links'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    appState[id.replace(/-([a-z])/g, g => g[1].toUpperCase())] = document.getElementById(id).value;
                    document.getElementById('system-prompt-preview').value = getUnbreakableSystemPrompt();
                });
            });

            const chatInput = document.getElementById('chat-input');
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 192) + 'px';
            });
        }

        // --- UI Interactions ---
        function toggleSettings() {
            updateUIReflections(); // Refresh just in case
            document.getElementById('settings-panel').classList.remove('translate-x-full');
            document.getElementById('backdrop').classList.remove('hidden');
            setTimeout(() => document.getElementById('backdrop').classList.remove('opacity-0'), 10);
        }

        function closeSettings() {
            document.getElementById('settings-panel').classList.add('translate-x-full');
            document.getElementById('backdrop').classList.add('opacity-0');
            setTimeout(() => document.getElementById('backdrop').classList.add('hidden'), 300);
        }

        function saveSettings() {
            appState.apiKey = document.getElementById('api-key').value.trim();
            appState.aiName = document.getElementById('ai-name').value.trim() || "SeekAI";
            appState.companyName = document.getElementById('company-name').value.trim() || "SeekerSagar Pvt. Ltd.";
            appState.creatorName = document.getElementById('creator-name').value.trim() || "Sagar Raj";
            appState.companyLinks = document.getElementById('company-links').value.trim();
            appState.temperature = parseFloat(document.getElementById('temperature').value);
            appState.topP = parseFloat(document.getElementById('top-p').value);
            appState.maxTokens = parseInt(document.getElementById('max-tokens').value) || 4096;
            
            const selectedModel = document.getElementById('model-select').value;
            appState.modelId = selectedModel === 'custom' ? (document.getElementById('custom-model-id').value.trim() || "anthropic/claude-3.5-sonnet") : selectedModel;

            saveState();
            updateUIReflections();
            closeSettings();
        }

        function clearChat() {
            if(confirm("Are you sure you want to completely erase the chat history?")) {
                appState.messages = [];
                saveState();
                document.getElementById('messages-list').innerHTML = `
                    <div id="welcome-screen" class="flex flex-col items-center justify-center text-center mt-24 sm:mt-32 opacity-100 transition-opacity duration-500">
                        <div class="w-16 h-16 rounded-2xl bg-surface border border-border flex items-center justify-center mb-6 shadow-2xl">
                            <svg class="w-8 h-8 text-accent relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </div>
                        <h2 class="text-2xl font-semibold mb-3 tracking-tight">Memory Cleared.</h2>
                        <p class="text-textMuted text-sm">Awaiting new instructions.</p>
                    </div>`;
            }
        }

        // --- Canvas UI Actions ---
        function toggleArtifactTab(id, tab) {
            const previewBtn = document.getElementById(`tab-btn-preview-${id}`);
            const codeBtn = document.getElementById(`tab-btn-code-${id}`);
            const previewFrame = document.getElementById(`preview-frame-${id}`);
            const codeFrame = document.getElementById(`code-frame-${id}`);

            if (tab === 'preview') {
                if(previewBtn) { previewBtn.classList.add('bg-accent', 'text-white'); previewBtn.classList.remove('text-textMuted', 'hover:bg-surfaceHover'); }
                if(codeBtn) { codeBtn.classList.remove('bg-accent', 'text-white'); codeBtn.classList.add('text-textMuted', 'hover:bg-surfaceHover'); }
                if(previewFrame) previewFrame.classList.remove('hidden');
                if(codeFrame) codeFrame.classList.add('hidden');
            } else {
                if(previewBtn) { previewBtn.classList.remove('bg-accent', 'text-white'); previewBtn.classList.add('text-textMuted', 'hover:bg-surfaceHover'); }
                if(codeBtn) { codeBtn.classList.add('bg-accent', 'text-white'); codeBtn.classList.remove('text-textMuted', 'hover:bg-surfaceHover'); }
                if(previewFrame) previewFrame.classList.add('hidden');
                if(codeFrame) codeFrame.classList.remove('hidden');
            }
        }

        function copyArtifact(id) {
            const textarea = document.getElementById(`raw-code-${id}`);
            // Unescape the HTML before copying to get original string
            const text = textarea.value
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'");

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById(`copy-btn-${id}`);
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg class="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span class="text-green-400">Copied!</span>`;
                setTimeout(() => btn.innerHTML = originalHtml, 2000);
            });
        }

        function downloadArtifact(id, filename) {
            const textarea = document.getElementById(`raw-code-${id}`);
            const text = textarea.value
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'");

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- Chat Logic ---
        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function createMessageElement(role, contentData) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full animate-[fadeIn_0.3s_ease-out] ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let htmlContent = "";
            let imageHtml = "";
            
            // Handle Multi-modal format for rendering
            if (Array.isArray(contentData)) {
                const textPart = contentData.find(c => c.type === 'text');
                const imgPart = contentData.find(c => c.type === 'image_url');
                
                if (textPart) htmlContent = escapeHtml(textPart.text);
                if (imgPart) imageHtml = `<img src="${imgPart.image_url.url}" class="max-w-xs rounded-lg mb-3 border border-border" alt="User upload">`;
            } else {
                htmlContent = role === 'user' ? escapeHtml(contentData) : marked.parse(contentData || '');
            }

            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="bg-surfaceHover text-textMain px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] sm:max-w-[75%] whitespace-pre-wrap text-sm sm:text-base leading-relaxed border border-border">
                        ${imageHtml}
                        ${htmlContent}
                    </div>
                `;
            } else {
                msgDiv.innerHTML = `
                    <div class="flex gap-4 max-w-[95%] sm:max-w-[85%] w-full">
                        <div class="w-8 h-8 rounded shrink-0 bg-accent/10 border border-accent/20 flex items-center justify-center mt-1">
                            <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        </div>
                        <div class="prose prose-invert prose-blue max-w-none text-sm sm:text-base message-content overflow-hidden text-textMain/90 w-full pb-4">
                            ${htmlContent}
                        </div>
                    </div>
                `;
            }
            return msgDiv;
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const chatInput = document.getElementById('chat-input');
            const text = chatInput.value.trim();
            if (!text && !pendingImageBase64) return;

            if (!appState.apiKey) {
                toggleSettings();
                showError("Configuration Required: Enter API Key");
                return;
            }

            const ws = document.getElementById('welcome-screen');
            if (ws && !ws.classList.contains('hidden')) ws.classList.add('hidden');

            // Format User Content (Standard string OR Array if image exists)
            let userContent = text;
            if (pendingImageBase64) {
                userContent = [
                    { type: "text", text: text || "Please analyze this image." },
                    { type: "image_url", image_url: { url: pendingImageBase64 } }
                ];
            }

            // Update UI & State
            appState.messages.push({ role: 'user', content: userContent });
            document.getElementById('messages-list').appendChild(createMessageElement('user', userContent));
            saveState(); // Persist immediately
            
            // Clean up inputs
            chatInput.value = '';
            chatInput.style.height = 'auto';
            removeImage();
            scrollToBottom();

            isGenerating = true;
            document.getElementById('send-btn').disabled = true;

            const assistantMsgDiv = createMessageElement('assistant', '');
            const contentContainer = assistantMsgDiv.querySelector('.message-content');
            contentContainer.innerHTML = `<div class="flex items-center h-6"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            document.getElementById('messages-list').appendChild(assistantMsgDiv);
            scrollToBottom();

            try {
                // Prepend system prompt to payload but don't save to history to keep it dynamic based on current settings
                const payloadMessages = [{ role: "system", content: getUnbreakableSystemPrompt() }, ...appState.messages];

                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${appState.apiKey}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": appState.companyName,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: appState.modelId,
                        messages: payloadMessages,
                        temperature: appState.temperature,
                        top_p: appState.topP,
                        max_tokens: appState.maxTokens,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`API Error ${response.status} - Ensure selected model supports Vision if sending images.`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let assistantReply = "";
                let buffer = "";
                
                contentContainer.innerHTML = ""; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (line.trim().startsWith('data: ')) {
                            const data = line.trim().slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.error) throw new Error(parsed.error.message);
                                
                                const token = parsed.choices[0]?.delta?.content || "";
                                assistantReply += token;
                                
                                artifactCounter = 0; // Reset counter for deterministic IDs during streaming
                                contentContainer.innerHTML = marked.parse(assistantReply);
                                
                                const container = document.getElementById('chat-container');
                                if (container.scrollHeight - container.scrollTop < container.clientHeight + 100) {
                                    scrollToBottom();
                                }
                            } catch (e) { /* Buffer incomplete */ }
                        }
                    }
                }

                // Append and save state
                appState.messages.push({ role: 'assistant', content: assistantReply });
                saveState();

            } catch (error) {
                console.error("Engine Error:", error);
                showError(error.message);
                contentContainer.innerHTML = `<p class="text-red-400 font-medium py-2 border border-red-900/50 bg-red-900/10 rounded-lg px-4 mt-2">Engine Alert: ${error.message}</p>`;
                appState.messages.pop(); // Remove user message from state on fail
                saveState();
            } finally {
                isGenerating = false;
                document.getElementById('send-btn').disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);

        window.onload = initApp;
    </script>
</body>
</html>
