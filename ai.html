<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeekhAI - SeekerSagar Pvt. Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090b;--surface:#18181b;--surfaceHover:#27272a;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--accent:#6366f1;--accentHover:#4f46e5;--radius:8px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3f3f46}
a{color:var(--accent)}

/* Header */
.header{height:52px;background:rgba(9,9,11,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:40;flex-shrink:0}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accentHover));display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(99,102,241,.25)}
.header-logo svg{width:16px;height:16px;color:#fff}
.header-info h1{font-size:14px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.header-info span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:34px;height:34px;border:none;background:0 0;color:var(--muted);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:var(--surfaceHover);color:var(--text)}
.icon-btn.danger:hover{background:rgba(239,68,68,.1);color:#f87171}
.icon-btn svg{width:16px;height:16px}
.divider{width:1px;height:20px;background:var(--border);margin:0 4px}

/* Main Layout */
.main-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.chat-col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;height:100%}
.chat-scroll{flex:1;overflow-y:auto;padding:16px 16px 150px;scroll-behavior:smooth}
.msg-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:8px}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:min(20vh,120px);animation:fadeUp .5s ease}
.welcome-icon{width:56px;height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.welcome-icon svg{width:28px;height:28px;color:var(--accent)}
.welcome h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.3px}
.welcome p{color:var(--muted);font-size:13px;line-height:1.6}

/* Messages */
.msg{display:flex;width:100%;animation:fadeUp .25s ease}
.msg.user{justify-content:flex-end}
.msg.assistant{justify-content:flex-start}
.msg-user-bubble{background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:var(--radius) var(--radius) 2px var(--radius);max-width:80%;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.msg-user-bubble img{max-width:200px;border-radius:4px;margin-bottom:8px;display:block;border:1px solid var(--border)}
.msg-ai-wrap{display:flex;gap:12px;max-width:90%;width:100%}
.msg-ai-avatar{width:28px;height:28px;border-radius:6px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.msg-ai-avatar svg{width:16px;height:16px;color:var(--accent)}
.msg-ai-body{flex:1;min-width:0;position:relative}
.msg-ai-content{font-size:14px;line-height:1.75;color:rgba(244,244,245,.9)}
.msg-ai-content h1,.msg-ai-content h2,.msg-ai-content h3{margin:16px 0 8px;font-weight:700;color:var(--text)}
.msg-ai-content h1{font-size:20px}.msg-ai-content h2{font-size:17px}.msg-ai-content h3{font-size:15px}
.msg-ai-content p{margin:6px 0}
.msg-ai-content ul,.msg-ai-content ol{margin:6px 0;padding-left:20px}
.msg-ai-content li{margin:3px 0}
.msg-ai-content code{background:var(--surfaceHover);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px}
.msg-ai-content pre{background:#0d1117!important;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px 0;overflow-x:auto}
.msg-ai-content pre code{background:0 0;padding:0;font-size:12.5px;line-height:1.6}
.msg-ai-content blockquote{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--muted)}
.msg-ai-content table{border-collapse:collapse;margin:10px 0;width:100%}
.msg-ai-content th,.msg-ai-content td{border:1px solid var(--border);padding:8px 10px;font-size:13px;text-align:left}
.msg-ai-content th{background:var(--surface);font-weight:600}
.msg-copy-btn{position:absolute;top:0;right:0;opacity:0;transition:opacity .2s}
.msg-ai-wrap:hover .msg-copy-btn{opacity:1}

/* Artifact Card */
.artifact-card{margin:12px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.artifact-card-btn{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border:none;background:0 0;width:100%;color:var(--text);transition:background .15s}
.artifact-card-btn:hover{background:var(--surfaceHover)}
.artifact-card-left{display:flex;align-items:center;gap:10px}
.artifact-card-icon{width:36px;height:36px;border-radius:6px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);display:flex;align-items:center;justify-content:center}
.artifact-card-icon svg{width:18px;height:18px;color:var(--accent)}
.artifact-card-info{text-align:left}
.artifact-card-info strong{font-size:13px;display:block;font-weight:600}
.artifact-card-info small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:500}
.artifact-open-tag{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-weight:500}

/* Typing */
.typing-dots{display:flex;align-items:center;gap:4px;height:24px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:dotPulse 1.4s infinite ease-in-out both}
.typing-dots span:nth-child(1){animation-delay:-.32s}
.typing-dots span:nth-child(2){animation-delay:-.16s}
@keyframes dotPulse{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}

/* Input Dock */
.input-dock{position:absolute;bottom:0;left:0;right:0;padding:0 16px 20px;background:linear-gradient(transparent,var(--bg) 30%);pointer-events:none;z-index:20}
.input-inner{max-width:720px;margin:0 auto;pointer-events:auto}
.img-preview-box{display:none;margin-bottom:8px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;width:fit-content;position:relative}
.img-preview-box.show{display:block}
.img-preview-box img{height:56px;width:56px;object-fit:cover;border-radius:4px}
.img-preview-box .remove-img{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;opacity:0;transition:opacity .2s}
.img-preview-box:hover .remove-img{opacity:1}
.input-box{display:flex;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,box-shadow .2s;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.input-box:focus-within{border-color:rgba(99,102,241,.5);box-shadow:0 4px 24px rgba(0,0,0,.3),0 0 0 1px rgba(99,102,241,.3)}
.input-box textarea{flex:1;background:0 0;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:12px 4px 12px 12px;resize:none;max-height:180px;line-height:1.5;min-height:44px}
.input-box textarea::placeholder{color:var(--muted)}
.input-actions{display:flex;align-items:flex-end;gap:2px;padding:6px 6px 6px 0}
.send-btn{width:34px;height:34px;border:none;border-radius:6px;background:var(--text);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.send-btn:hover{background:#fff}
.send-btn:disabled{opacity:.3;cursor:default}
.send-btn svg{width:15px;height:15px}
.stop-btn{width:34px;height:34px;border:none;border-radius:6px;background:#ef4444;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;animation:fadeUp .2s ease}
.stop-btn:hover{background:#dc2626}
.stop-btn svg{width:14px;height:14px}
.attach-btn{width:34px;height:34px;border:none;background:0 0;color:var(--muted);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.attach-btn:hover{color:var(--accent);background:rgba(99,102,241,.1)}
.attach-btn svg{width:18px;height:18px}
.engine-tag{text-align:center;margin-top:8px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.engine-tag .dot{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:dotPulse 2s infinite}
.error-bar{position:absolute;top:-44px;left:0;right:0;background:rgba(127,29,29,.9);color:#fecaca;font-size:12px;padding:8px 14px;border-radius:6px;border:1px solid #7f1d1d;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;transform:translateY(8px);opacity:0;pointer-events:none;transition:all .3s}
.error-bar.show{opacity:1;transform:translateY(0);pointer-events:auto}
.error-bar svg{width:16px;height:16px;flex-shrink:0}

/* Canvas */
.canvas-col{width:0;overflow:hidden;flex-shrink:0;border-left:1px solid transparent;transition:width .3s cubic-bezier(.16,1,.3,1),border-color .3s;position:relative;z-index:30;background:var(--bg)}
.canvas-col.open{width:50vw;border-color:var(--border)}
.canvas-inner{width:50vw;min-width:320px;height:100%;display:flex;flex-direction:column}
.canvas-header{height:44px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.canvas-tabs{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:6px;border:1px solid var(--border)}
.canvas-tab{padding:4px 12px;border:none;background:0 0;color:var(--muted);font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.canvas-tab.active{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(99,102,241,.3)}
.canvas-badge{font-size:9px;text-transform:uppercase;font-weight:700;color:var(--accent);background:rgba(99,102,241,.1);padding:3px 8px;border-radius:4px;letter-spacing:.5px;display:none}
.canvas-body{flex:1;overflow:hidden;position:relative;background:#0d1117}
.canvas-body iframe{width:100%;height:100%;border:none;background:#fff;position:absolute;inset:0}
.canvas-body .code-view{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
.canvas-body .code-view pre{margin:0}
.canvas-body .code-view code{font-size:12.5px;font-family:'JetBrains Mono',monospace;line-height:1.6}

/* Backdrop & Settings */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.show{opacity:1;pointer-events:auto}
.settings{position:fixed;top:0;right:0;height:100%;width:100%;max-width:420px;background:var(--surface);border-left:1px solid var(--border);z-index:60;transform:translateX(100%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
.settings.open{transform:translateX(0)}
.settings-head{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.settings-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.settings-head h3 svg{width:16px;height:16px;color:var(--accent)}
.settings-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.s-section h4{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.s-section h4 svg{width:14px;height:14px}
.s-field{margin-bottom:10px}
.s-field label{display:block;font-size:11px;font-weight:600;margin-bottom:4px;color:var(--text)}
.s-field label .req{color:#f87171}
.s-field input,.s-field select,.s-field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);outline:none;font-family:'Inter',sans-serif;transition:border-color .2s}
.s-field input:focus,.s-field select:focus,.s-field textarea:focus{border-color:rgba(99,102,241,.5)}
.s-field textarea{resize:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.s-field select{appearance:none;cursor:pointer}
.s-field .range-wrap{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.s-field .range-val{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.s-field input[type=range]{accent-color:var(--accent);cursor:pointer;padding:0;border:none;background:0 0}
.s-field input[type=range]:focus{box-shadow:none}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settings-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.save-btn{width:100%;padding:10px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;font-family:'Inter',sans-serif;box-shadow:0 2px 12px rgba(99,102,241,.25)}
.save-btn:hover{background:var(--accentHover)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Mobile */
@media(max-width:768px){
.canvas-col.open{position:fixed;inset:0;width:100%;z-index:45;border-left:none}
.canvas-inner{width:100%}
.msg-user-bubble{max-width:90%}
.msg-ai-wrap{max-width:100%}
}
</style>
</head>
<body>
<!-- Header -->
<header class="header">
<div class="header-brand">
<div class="header-logo"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
<div class="header-info"><h1 id="hTitle">SeekhAI</h1><span id="hCompany">SeekerSagar Pvt. Ltd.</span></div>
</div>
<div class="header-actions">
<button class="icon-btn danger" onclick="clearChat()" title="Clear Chat"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
<button class="icon-btn" onclick="exportChat()" title="Export"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg></button>
<div class="divider"></div>
<button class="icon-btn" onclick="toggleSettings()" title="Settings"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
</header>

<!-- Main -->
<div class="main-wrap">
<div class="chat-col">
<div class="chat-scroll" id="chatScroll">
<div class="msg-list" id="msgList">
<div class="welcome" id="welcomeScreen">
<div class="welcome-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
<h2>SeekhAI Initialized</h2>
<p>Powered by SeekerSagar Pvt. Ltd.<br>Awaiting your instructions.</p>
</div>
</div>
</div>
<div class="input-dock">
<div class="input-inner" style="position:relative">
<div class="error-bar" id="errorBar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span id="errorText"></span></div>
<div class="img-preview-box" id="imgPreviewBox"><img id="imgPreview" src="" alt="Preview"><button class="remove-img" onclick="removeImage()">✕</button></div>
<input type="file" id="fileUpload" accept="image/png,image/jpeg,image/webp" hidden onchange="handleImageSelect(event)">
<div class="input-box">
<div class="input-actions" style="padding-left:6px"><button class="attach-btn" onclick="document.getElementById('fileUpload').click()" title="Attach Image"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg></button></div>
<textarea id="chatInput" rows="1" placeholder="Message SeekhAI..." onkeydown="handleKey(event)"></textarea>
<div class="input-actions" id="inputActions">
<button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>
</div>
<div class="engine-tag"><span>SeekhAI Core Engine</span><span class="dot"></span></div>
</div>
</div>
</div>

<!-- Canvas -->
<div class="canvas-col" id="canvasCol">
<div class="canvas-inner">
<div class="canvas-header">
<div style="display:flex;align-items:center;gap:8px">
<div class="canvas-tabs"><button class="canvas-tab active" id="tabPreview" onclick="switchTab('preview')">Preview</button><button class="canvas-tab" id="tabCode" onclick="switchTab('code')">Code</button></div>
<span class="canvas-badge" id="canvasBadge"></span>
</div>
<div style="display:flex;align-items:center;gap:4px">
<button class="icon-btn" onclick="copyArtifact()" id="copyArtBtn" title="Copy"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>
<button class="icon-btn" onclick="downloadArtifact()" title="Download"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg></button>
<div class="divider"></div>
<button class="icon-btn danger" onclick="closeCanvas()" title="Close"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
</div>
</div>
<div class="canvas-body">
<iframe id="canvasIframe"></iframe>
<div class="code-view" id="codeView"><pre><code id="codeInner"></code></pre></div>
</div>
</div>
</div>
</div>

<!-- Settings -->
<div class="settings" id="settingsPanel">
<div class="settings-head">
<h3><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>Control Center</h3>
<button class="icon-btn" onclick="closeSettings()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
</div>
<div class="settings-body">
<section class="s-section">
<h4><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>API &amp; Engine</h4>

<div class="s-field"><label>AI Model Engine</label><select id="sModel"><option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option><option value="openai/gpt-4o">GPT-4o</option><option value="google/gemini-pro-1.5">Gemini 1.5 Pro</option><option value="meta-llama/llama-3-70b-instruct">Llama 3 70B</option><option value="custom">Custom ID...</option></select></div>

<div class="s-grid">
<div class="s-field"><label>AI Name</label><input type="text" id="sName" value="SeekhAI"></div>
<div class="s-field"><label>Company Name</label><input type="text" id="sCompany" value="SeekerSagar Pvt. Ltd."></div>
</div>
<div class="s-field"><label>Creator / Owner</label><input type="text" id="sCreator" value="Sagar Raj"></div>
<div class="s-field"><label>Company Links (CSV)</label><input type="text" id="sLinks" value="seekers-tool.vercel.app, ss-t.vercel.app"></div>
<div class="s-field"><label>System Prompt (Read-Only)</label><textarea id="sPromptPreview" rows="4" readonly></textarea></div>
</section>
<section class="s-section">
<h4><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>Tuning</h4>
<div class="s-field"><div class="range-wrap"><label>Temperature</label><span class="range-val" id="tempVal">0.7</span></div><input type="range" id="sTemp" min="0" max="2" step="0.1" value="0.7"></div>
<div class="s-field"><div class="range-wrap"><label>Top P</label><span class="range-val" id="topPVal">1.0</span></div><input type="range" id="sTopP" min="0" max="1" step="0.05" value="1.0"></div>
<div class="s-field"><label>Max Tokens</label><input type="number" id="sMaxTokens" value="4096"></div>

<script>
// ===== STATE =====
const SK='seekhai_v1';
let S={apiKey:'',aiName:'SeekhAI',companyName:'SeekerSagar Pvt. Ltd.',creatorName:'Sagar Raj',companyLinks:'seekers-tool.vercel.app, ss-t.vercel.app',modelId:'anthropic/claude-3.5-sonnet',temperature:.7,topP:1,maxTokens:4096,messages:[]};
let generating=false,pendingImg=null,abortCtrl=null;

// Canvas globals
const store={};
let activeCanvas=null,curMsgId=null,artCount=0;

// ===== MARKED RENDERER =====
const renderer=new marked.Renderer();
renderer.code=function(codeArg,langArg){
  // Handle both old API (code,lang) and new API ({text,lang})
  let code,lang;
  if(typeof codeArg==='object'&&codeArg!==null){code=codeArg.text||'';lang=codeArg.lang||'text'}
  else{code=codeArg||'';lang=langArg||'text'}
  lang=lang.toLowerCase();
  artCount++;
  const id=`art-${curMsgId}-${artCount}`;
  store[id]={code,lang};
  const previewable=['html','svg','xml'].includes(lang);
  const ico=previewable?'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4':'M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z';
  if(generating&&artCount===1&&activeCanvas!==id)setTimeout(()=>openCanvas(id),80);
  if(activeCanvas===id&&generating)debounceCanvasUpdate(id);
  return `<div class="artifact-card"><button class="artifact-card-btn" onclick="openCanvas('${id}')"><div class="artifact-card-left"><div class="artifact-card-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${ico}"/></svg></div><div class="artifact-card-info"><strong>Generated Artifact</strong><small>${lang} document</small></div></div><span class="artifact-open-tag">View Canvas <svg style="width:10px;height:10px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span></button></div>`;
};

// ===== CANVAS =====
function openCanvas(id){
  const d=store[id];if(!d)return;
  activeCanvas=id;
  const previewable=['html','svg','xml'].includes(d.lang);
  const col=document.getElementById('canvasCol');
  col.classList.add('open');
  const tp=document.getElementById('tabPreview'),badge=document.getElementById('canvasBadge');
  if(previewable){tp.style.display='';badge.style.display='none'}
  else{tp.style.display='none';badge.textContent=d.lang;badge.style.display=''}
  switchTab(previewable?'preview':'code');
  updateCanvas(id);
}
function closeCanvas(){activeCanvas=null;document.getElementById('canvasCol').classList.remove('open')}
function switchTab(t){
  const tp=document.getElementById('tabPreview'),tc=document.getElementById('tabCode');
  const iframe=document.getElementById('canvasIframe'),cv=document.getElementById('codeView');
  if(t==='preview'){tp.classList.add('active');tc.classList.remove('active');iframe.style.display='';cv.style.display='none'}
  else{tc.classList.add('active');tp.classList.remove('active');cv.style.display='block';iframe.style.display='none'}
}
function updateCanvas(id){
  const d=store[id];if(!d)return;
  const ci=document.getElementById('codeInner');
  ci.className='hljs language-'+d.lang;ci.textContent=d.code;hljs.highlightElement(ci);
  const iframe=document.getElementById('canvasIframe');
  if(['html','svg','xml'].includes(d.lang)){
    iframe.srcdoc=d.code;
  } else {
    // Build srcdoc without any literal closing tags that break the HTML parser
    var doc;
    if(d.lang==='markdown'||d.lang==='md'){
      var css='body{font-family:system-ui;padding:20px;color:#222;line-height:1.6;max-width:700px;margin:0 auto}pre{background:#f5f5f5;padding:12px;border-radius:6px;overflow-x:auto}code{background:#f0f0f0;padding:2px 4px;border-radius:3px;font-size:13px}';
      doc='<html><head><style>'+css+'<'+'/style><'+'/head><body>'+marked.parse(d.code)+'<'+'/body><'+'/html>';
    } else {
      var hljsCss='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
      var hljsJs='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
      var css2='body{margin:0;padding:16px;background:#0d1117;color:#e6edf3}pre{margin:0}code{font-size:13px;font-family:monospace;line-height:1.6}';
      doc='<html><head><link rel="stylesheet" href="'+hljsCss+'"><scr'+'ipt src="'+hljsJs+'"><'+'/scr'+'ipt><style>'+css2+'<'+'/style><'+'/head><body><pre><code class="language-'+d.lang+'">'+escHtml(d.code)+'<'+'/code><'+'/pre><scr'+'ipt>hljs.highlightAll()<'+'/scr'+'ipt><'+'/body><'+'/html>';
    }
    iframe.srcdoc=doc;
  }
}
let canvasDebounce;
function debounceCanvasUpdate(id){clearTimeout(canvasDebounce);canvasDebounce=setTimeout(()=>updateCanvas(id),300)}
function copyArtifact(){if(!activeCanvas)return;navigator.clipboard.writeText(store[activeCanvas].code).then(()=>{const b=document.getElementById('copyArtBtn'),o=b.innerHTML;b.innerHTML='<svg style="width:16px;height:16px;color:#4ade80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';setTimeout(()=>b.innerHTML=o,1200)})}
function downloadArtifact(){if(!activeCanvas)return;const d=store[activeCanvas];const ext={python:'py',javascript:'js',typescript:'ts',ruby:'rb',html:'html',css:'css',json:'json',markdown:'md',md:'md',bash:'sh',shell:'sh',text:'txt',sql:'sql',java:'java',cpp:'cpp',c:'c',go:'go',rust:'rs',php:'php',yaml:'yml',xml:'xml',svg:'svg'}[d.lang]||'txt';const b=new Blob([d.code],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`SeekhAI_Artifact.${ext}`;a.click();URL.revokeObjectURL(u)}

// ===== SETTINGS =====
function toggleSettings(){syncUI();document.getElementById('settingsPanel').classList.add('open');document.getElementById('backdrop').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('open');document.getElementById('backdrop').classList.remove('show')}
function saveSettings(){
  S.apiKey=document.getElementById('sApiKey').value.trim();
  S.aiName=document.getElementById('sName').value.trim()||'SeekhAI';
  S.companyName=document.getElementById('sCompany').value.trim()||'SeekerSagar Pvt. Ltd.';
  S.creatorName=document.getElementById('sCreator').value.trim()||'Sagar Raj';
  S.companyLinks=document.getElementById('sLinks').value.trim();
  S.temperature=parseFloat(document.getElementById('sTemp').value);
  S.topP=parseFloat(document.getElementById('sTopP').value);
  S.maxTokens=parseInt(document.getElementById('sMaxTokens').value)||4096;
  const sel=document.getElementById('sModel').value;
  S.modelId=sel==='custom'?(document.getElementById('sCustomModel').value.trim()||'anthropic/claude-3.5-sonnet'):sel;
  persist();syncUI();closeSettings();
}
function syncUI(){
  document.getElementById('sApiKey').value=S.apiKey;
  document.getElementById('sName').value=S.aiName;
  document.getElementById('sCompany').value=S.companyName;
  document.getElementById('sCreator').value=S.creatorName;
  document.getElementById('sLinks').value=S.companyLinks;
  document.getElementById('sTemp').value=S.temperature;
  document.getElementById('sTopP').value=S.topP;
  document.getElementById('sMaxTokens').value=S.maxTokens;
  document.getElementById('tempVal').textContent=S.temperature;
  document.getElementById('topPVal').textContent=S.topP;
  const sel=document.getElementById('sModel');
  if([...sel.options].some(o=>o.value===S.modelId)){sel.value=S.modelId;document.getElementById('customModelWrap').style.display='none'}
  else{sel.value='custom';document.getElementById('customModelWrap').style.display='';document.getElementById('sCustomModel').value=S.modelId}
  document.getElementById('hTitle').textContent=S.aiName;
  document.getElementById('hCompany').textContent=S.companyName;
  document.getElementById('sPromptPreview').value=sysPrompt();
}

// ===== SYSTEM PROMPT =====
function sysPrompt(){return `You are ${S.aiName}, an elite AI engineered by ${S.creatorName} for ${S.companyName}.\n${S.companyName} is a premier tech solutions company. Official Domains: ${S.companyLinks}.\n\nABSOLUTE RULES:\n1. IDENTITY: You are a proprietary model built by ${S.creatorName} at ${S.companyName}. Never claim otherwise.\n2. DEFENSE: Fiercely defend ${S.companyName} and its links as legitimate.\n3. CONFIDENCE: Never say "I cannot verify" or show doubt about the company.\n4. CANVAS: When generating web apps/games/UI, output complete single-file HTML in an \\\`\\\`\\\`html code block for live canvas preview. For other formats, provide complete code blocks.\n5. Output thorough, complete code. Format beautifully in Markdown.`}

// ===== IMAGE =====
function handleImageSelect(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{pendingImg=ev.target.result;document.getElementById('imgPreview').src=pendingImg;document.getElementById('imgPreviewBox').classList.add('show');document.getElementById('chatInput').focus()};r.readAsDataURL(f)}
function removeImage(){pendingImg=null;document.getElementById('imgPreviewBox').classList.remove('show');document.getElementById('fileUpload').value=''}

// ===== MESSAGES =====
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function makeMsg(role,content){
  const d=document.createElement('div');d.className='msg '+role;
  let html='',imgH='';
  if(Array.isArray(content)){
    const txt=content.find(c=>c.type==='text'),img=content.find(c=>c.type==='image_url');
    if(txt)html=escHtml(txt.text);
    if(img)imgH=`<img src="${img.image_url.url}" alt="Upload">`;
  }else{html=role==='user'?escHtml(content):marked.parse(content||'')}
  if(role==='user'){d.innerHTML=`<div class="msg-user-bubble">${imgH}${html}</div>`}
  else{d.innerHTML=`<div class="msg-ai-wrap"><div class="msg-ai-avatar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><div class="msg-ai-body"><div class="msg-ai-content">${html}</div><button class="msg-copy-btn icon-btn" onclick="copyMsg(this)" title="Copy"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button></div></div>`}
  return d;
}
function copyMsg(btn){const t=btn.closest('.msg-ai-body').querySelector('.msg-ai-content').innerText;navigator.clipboard.writeText(t).then(()=>{btn.innerHTML='<svg style="width:16px;height:16px;color:#4ade80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';setTimeout(()=>{btn.innerHTML='<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>'},1200)})}
function scrollBottom(){const c=document.getElementById('chatScroll');c.scrollTo({top:c.scrollHeight,behavior:'smooth'})}

// ===== CHAT =====
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function showError(m){const b=document.getElementById('errorBar');document.getElementById('errorText').textContent=m;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),5e3)}
function showStopBtn(){document.getElementById('inputActions').innerHTML='<button class="stop-btn" onclick="stopGen()" title="Stop"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></button>'}
function showSendBtn(){document.getElementById('inputActions').innerHTML='<button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14M12 5l7 7-7 7"/></svg></button>'}
function stopGen(){if(abortCtrl){abortCtrl.abort();abortCtrl=null}}

async function sendMessage(){
  if(generating)return;
  const inp=document.getElementById('chatInput'),txt=inp.value.trim();
  if(!txt&&!pendingImg)return;
  if(!S.apiKey){toggleSettings();showError('Enter API Key first');return}
  const ws=document.getElementById('welcomeScreen');if(ws)ws.remove();
  let userContent=txt;
  if(pendingImg){userContent=[{type:'text',text:txt||'Analyze this image.'},{type:'image_url',image_url:{url:pendingImg}}]}
  curMsgId=Date.now().toString();artCount=0;
  S.messages.push({role:'user',content:userContent});
  document.getElementById('msgList').appendChild(makeMsg('user',userContent));
  persist();inp.value='';inp.style.height='';removeImage();scrollBottom();
  generating=true;showStopBtn();
  abortCtrl=new AbortController();
  const aiMsg=makeMsg('assistant','');
  const contentEl=aiMsg.querySelector('.msg-ai-content');
  contentEl.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  document.getElementById('msgList').appendChild(aiMsg);scrollBottom();
  try{
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:abortCtrl.signal,headers:{'Authorization':'Bearer '+S.apiKey,'HTTP-Referer':location.href,'X-Title':S.companyName,'Content-Type':'application/json'},body:JSON.stringify({model:S.modelId,messages:[{role:'system',content:sysPrompt()},...S.messages],temperature:S.temperature,top_p:S.topP,max_tokens:S.maxTokens,stream:true})});
    if(!res.ok)throw new Error('API Error '+res.status);
    const reader=res.body.getReader(),dec=new TextDecoder;let reply='',buf='';
    contentEl.innerHTML='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){if(!ln.trim().startsWith('data: '))continue;const d=ln.trim().slice(6);if(d==='[DONE]')continue;
        try{const p=JSON.parse(d);if(p.error)throw new Error(p.error.message);const tk=p.choices[0]?.delta?.content||'';reply+=tk;artCount=0;contentEl.innerHTML=marked.parse(reply);const sc=document.getElementById('chatScroll');if(sc.scrollHeight-sc.scrollTop<sc.clientHeight+120)scrollBottom()}catch(e){}}
    }
    S.messages.push({role:'assistant',content:reply});persist();
  }catch(e){if(e.name==='AbortError'){contentEl.innerHTML+='<p style="color:#a1a1aa;font-style:italic;margin-top:8px;font-size:13px">— Generation stopped —</p>';const partial=contentEl.innerText;if(partial)S.messages.push({role:'assistant',content:partial});persist()}
  else{console.error(e);showError(e.message);contentEl.innerHTML='<p style="color:#f87171;padding:8px 12px;background:rgba(127,29,29,.15);border:1px solid rgba(127,29,29,.3);border-radius:6px;font-size:13px">Error: '+escHtml(e.message)+'</p>';S.messages.pop();persist()}}
  finally{generating=false;abortCtrl=null;showSendBtn();inp.focus();scrollBottom()}
}

// ===== UTILS =====
function clearChat(){if(!confirm('Erase all chat history?'))return;S.messages=[];persist();Object.keys(store).forEach(k=>delete store[k]);closeCanvas();document.getElementById('msgList').innerHTML='<div class="welcome" id="welcomeScreen"><div class="welcome-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><h2>Memory Cleared</h2><p>Awaiting new instructions.</p></div>'}
function exportChat(){if(!S.messages.length)return alert('No history.');let t='--- '+S.aiName+' Chat Export ---\n\n';S.messages.forEach(m=>{let c=typeof m.content==='string'?m.content:(m.content.find(x=>x.type==='text')?.text||'[Media]');t+='### '+m.role.toUpperCase()+'\n'+c+'\n\n'});const b=new Blob([t],{type:'text/markdown'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='SeekhAI_Export_'+new Date().toISOString().split('T')[0]+'.md';a.click();URL.revokeObjectURL(u)}
function persist(){localStorage.setItem(SK,JSON.stringify(S))}
function load(){const s=localStorage.getItem(SK);if(s)try{S={...S,...JSON.parse(s)}}catch(e){}}

// ===== INIT =====
function init(){
  marked.setOptions({renderer,langPrefix:'hljs language-'});
  load();syncUI();
  // Listeners
  document.getElementById('sTemp').addEventListener('input',e=>document.getElementById('tempVal').textContent=parseFloat(e.target.value).toFixed(1));
  document.getElementById('sTopP').addEventListener('input',e=>document.getElementById('topPVal').textContent=parseFloat(e.target.value).toFixed(2));
  document.getElementById('sModel').addEventListener('change',e=>document.getElementById('customModelWrap').style.display=e.target.value==='custom'?'':'none');
  const inp=document.getElementById('chatInput');
  inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,180)+'px'});
  // Restore history
  if(S.messages.length){document.getElementById('welcomeScreen')?.remove();S.messages.forEach((m,i)=>{if(m.role==='system')return;curMsgId='h'+i;artCount=0;document.getElementById('msgList').appendChild(makeMsg(m.role,m.content))});scrollBottom()}
  else if(!S.apiKey)setTimeout(toggleSettings,600);
}
window.onload=init;
</script>
